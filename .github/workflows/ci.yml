# push·PR마다 코드 검사(ruff), 타입 검사(mypy), 테스트(pytest)를 자동으로 돌린다
name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
concurrency: # 같은 브랜치에 새로 push하면 이전 검사는 취소
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: 린트 (ruff check)
        run: ruff check .
      - name: 포맷 검사 (ruff format --check)
        run: ruff format --check .
      - name: 타입 검사 (mypy)
        run: mypy
      - name: 테스트 (pytest)
        run: pytest -q
