# mypy type check: catches mismatched inputs/outputs between modules before running.
# Run: mypy   (keep this file ASCII-only: Windows reads it with the system code page)
[mypy]
python_version = 3.12
files = app, scripts
plugins = pydantic.mypy
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
